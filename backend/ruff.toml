target-version = "py312"
line-length = 100

[lint]
# E/F: erros básicos, I: ordem dos imports, B: bugs comuns, UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# O FastAPI usa Depends(...) como valor padrão de propósito
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
